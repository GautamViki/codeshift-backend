version: '3.8'

services:
  transpiler-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_transpiler_ai
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./alembic:/app/alembic
      - ./app/alembic.ini:/app/alembic.ini
    env_file:
      - .env.development
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-db:
    image: postgres:16
    container_name: codeshift_postgres
    environment:
      POSTGRES_USER: codeshift
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: codeshift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeshift -d codeshift"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata: