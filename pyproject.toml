[project]
name = "codeshift-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["app/generated_code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
